<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>

    <!-- ── Gradients ── -->

    <!-- Background: Deep cosmic nebula -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#020008"/>
      <stop offset="25%"  stop-color="#0a0022"/>
      <stop offset="50%"  stop-color="#140050"/>
      <stop offset="75%"  stop-color="#002860"/>
      <stop offset="100%" stop-color="#020008"/>
    </linearGradient>

    <!-- Name gradient: Cyan -> Pure White -> Electric Cyan -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="20%"  stop-color="#7dd3fc"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="80%"  stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#020008" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#020008" stop-opacity="0"/>
    </linearGradient>

    <!-- Scanner gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00b4d8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00b4d8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </linearGradient>

    <!-- Aurora radial gradients (4 dynamic ambient orbs) -->
    <radialGradient id="aur1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1d4ed8" stop-opacity="0.75"/>
      <stop offset="55%"  stop-color="#0d0060" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#020008" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0369a1" stop-opacity="0.65"/>
      <stop offset="55%"  stop-color="#003380" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020008" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur3" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6d28d9" stop-opacity="0.45"/>
      <stop offset="60%"  stop-color="#4a0080" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020008" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur4" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0e7490" stop-opacity="0.40"/>
      <stop offset="60%"  stop-color="#004060" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020008" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0077b6" stroke-width="0.5" opacity="0.16"/>
    </pattern>

    <!-- Shimmer highlight -->
    <linearGradient id="shimmerG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="38%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="62%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Ticker edge-fade mask -->
    <linearGradient id="tickerFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="7%"   stop-color="white" stop-opacity="1"/>
      <stop offset="93%"  stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="tickerMask">
      <rect x="180" y="215" width="840" height="28" fill="url(#tickerFade)"/>
    </mask>

    <!-- Name shimmer mask -->
    <mask id="nameMask">
      <text x="600" y="152" text-anchor="middle"
            font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
            font-size="76" font-weight="900" letter-spacing="5.5"
            fill="white">MUKTIKANTA PATI</text>
    </mask>

    <!-- Soft glow filter for brackets / badges -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      /* ── Aurora breathing ── */
      @keyframes aur1 {
        0%,100% { transform:translate(0px,0px)    scale(1.00) }
        33%     { transform:translate(55px,-28px)  scale(1.15) }
        66%     { transform:translate(-28px,18px)  scale(0.90) }
      }
      @keyframes aur2 {
        0%,100% { transform:translate(0px,0px)    scale(1.00) }
        50%     { transform:translate(-65px,30px)  scale(1.22) }
      }
      @keyframes aur3 {
        0%,100% { transform:translate(0px,0px)    scale(1.00) }
        40%     { transform:translate(30px,15px)   scale(1.12) }
        80%     { transform:translate(-15px,-20px) scale(0.88) }
      }
      @keyframes aur4 {
        0%,100% { transform:translate(0px,0px)    scale(1.00) }
        55%     { transform:translate(-45px,-20px) scale(1.18) }
      }

      /* ── Scanner sweep ── */
      @keyframes scan {
        0%   { transform:translateY(-340px); opacity:0   }
        8%   { opacity:.42 }
        92%  { opacity:.42 }
        100% { transform:translateY(680px);  opacity:0   }
      }

      /* ── Star twinkle variants ── */
      @keyframes tw-a { 0%,100%{opacity:.18} 50%{opacity:1.00} }
      @keyframes tw-b { 0%,100%{opacity:.50} 50%{opacity:1.00} }
      @keyframes tw-c { 0%,100%{opacity:.08} 50%{opacity:.90} }
      @keyframes tw-d { 0%,100%{opacity:.38} 50%{opacity:1.00} }
      @keyframes tw-e { 0%,100%{opacity:.28} 50%{opacity:1.00} }
      @keyframes tw-f { 0%,100%{opacity:.55} 50%{opacity:1.00} }

      /* ── 3 shooting stars ── */
      @keyframes sh1 {
        0%,5%  { opacity:0; transform:translate(50px,15px)    rotate(30deg) }
        9%     { opacity:1 }
        22%    { opacity:0; transform:translate(1130px,440px)  rotate(30deg) }
        100%   { opacity:0; transform:translate(1130px,440px)  rotate(30deg) }
      }
      @keyframes sh2 {
        0%,38% { opacity:0; transform:translate(180px,8px)    rotate(22deg) }
        42%    { opacity:1 }
        56%    { opacity:0; transform:translate(1100px,320px)  rotate(22deg) }
        100%   { opacity:0; transform:translate(1100px,320px)  rotate(22deg) }
      }
      @keyframes sh3 {
        0%,70% { opacity:0; transform:translate(40px,55px)    rotate(15deg) }
        74%    { opacity:1 }
        85%    { opacity:0; transform:translate(860px,240px)  rotate(15deg) }
        100%   { opacity:0; transform:translate(860px,240px)  rotate(15deg) }
      }

      /* ── Name glow pulse ── */
      @keyframes nameGlow {
        0%,100% { filter:drop-shadow(0 0  6px #38bdf8) drop-shadow(0 0 12px #0284c7) }
        50%     { filter:drop-shadow(0 0 18px #7dd3fc) drop-shadow(0 0 34px #0284c7)
                         drop-shadow(0 0 54px #0369a1) drop-shadow(0 0 74px #1e3a8a) }
      }

      /* ── Shimmer sweep ── */
      @keyframes shimmer {
        0%   { transform:translateX(-230px) }
        100% { transform:translateX(1440px) }
      }

      /* ── Accent line glow ── */
      @keyframes linePulse {
        0%,100% { filter:drop-shadow(0 0 3px #00b4d8) }
        50%     { filter:drop-shadow(0 0 11px #38bdf8) drop-shadow(0 0 24px #0284c7) }
      }

      /* ── Corner bracket draw-in ── */
      @keyframes drawBr { to { stroke-dashoffset:0 } }

      /* ── Text / element reveals ── */
      @keyframes fadeIn   { from{opacity:0} to{opacity:1}   }
      @keyframes fadeIn85 { from{opacity:0} to{opacity:.85} }

      /* ── Outer border glow pulse ── */
      @keyframes borderPulse {
        0%,100% { opacity:0.30 }
        50%     { opacity:0.75 }
      }

      /* ── Radar ripple ── */
      @keyframes ripple-a { 0%{opacity:0} 8%,26%{opacity:0.80} 55%,100%{opacity:0} }
      @keyframes ripple-b { 0%,18%{opacity:0} 28%,46%{opacity:0.55} 68%,100%{opacity:0} }
      @keyframes ripple-c { 0%,36%{opacity:0} 46%,60%{opacity:0.32} 82%,100%{opacity:0} }

      /* ── Circuit trace pulse ── */
      @keyframes traceFade {
        0%,100% { opacity:0.12 }
        50%     { opacity:0.38 }
      }

      /* ── Status dot blink ── */
      @keyframes blink {
        0%,100% { opacity:1.0 }
        50%     { opacity:0.18 }
      }

      /* ── Subtitle color pulse ── */
      @keyframes subtitleColor {
        0%,100% { fill: #bae6fd }
        50%     { fill: #38bdf8 }
      }

      /* ── Tech ticker scroll ── */
      @keyframes ticker {
        from { transform: translateX(1020px) }
        to   { transform: translateX(-1800px) }
      }

      /* Assign animations */
      .aur1 { animation: aur1 13s ease-in-out infinite }
      .aur2 { animation: aur2 17s ease-in-out infinite }
      .aur3 { animation: aur3 11s ease-in-out 2s infinite }
      .aur4 { animation: aur4 15s ease-in-out 1s infinite }

      .scan-beam { animation: scan 7s cubic-bezier(.4,0,.6,1) infinite }

      .twa { animation: tw-a 2.1s ease-in-out infinite }
      .twb { animation: tw-b 3.4s ease-in-out infinite }
      .twc { animation: tw-c 1.7s ease-in-out infinite }
      .twd { animation: tw-d 2.8s ease-in-out infinite }
      .twe { animation: tw-e 4.1s ease-in-out infinite }
      .twf { animation: tw-f 2.4s ease-in-out infinite }

      .sh1 { animation: sh1  9s ease-out infinite }
      .sh2 { animation: sh2 13s ease-out 3s infinite }
      .sh3 { animation: sh3 16s ease-out 7s infinite }

      .name-text {
        animation: nameGlow 4s ease-in-out infinite,
                   fadeIn 1.2s ease-out forwards;
      }
      .shimmer-bar { animation: shimmer 4.5s ease-in-out 1.2s infinite }

      .line-accent {
        animation: linePulse 3.5s ease-in-out infinite,
                   fadeIn 1.4s ease-out forwards;
      }

      .bracket {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        animation: drawBr 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
      }
      .br1 { animation-delay: 0.25s }
      .br2 { animation-delay: 0.40s }
      .br3 { animation-delay: 0.55s }
      .br4 { animation-delay: 0.70s }

      .badge-elem { animation: fadeIn 0.8s ease-out 1.1s forwards; opacity:0 }

      .subtitle-text {
        animation: subtitleColor 6s ease-in-out infinite,
                   fadeIn 1.5s ease-out forwards;
      }
      .company-ticker-text {
        animation: ticker 26s linear infinite;
      }
      .tech-text { animation: fadeIn85 1.8s ease-out forwards }

      .border-frame { animation: borderPulse 4s ease-in-out infinite }

      .r1a { animation: ripple-a 4s ease-out infinite }
      .r1b { animation: ripple-b 4s ease-out infinite }
      .r1c { animation: ripple-c 4s ease-out infinite }

      .r2a { animation: ripple-a 4s ease-out 2s infinite }
      .r2b { animation: ripple-b 4s ease-out 2s infinite }
      .r2c { animation: ripple-c 4s ease-out 2s infinite }

      .trace { animation: traceFade 3.5s ease-in-out infinite }

      .status-dot { animation: blink 2s ease-in-out infinite }
    </style>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- ── Aurora blobs ── -->
  <g opacity="0.85">
    <circle class="aur1" cx="300" cy="140" r="280" fill="url(#aur1)"/>
    <circle class="aur2" cx="880" cy="190" r="260" fill="url(#aur2)"/>
    <circle class="aur3" cx="620" cy="80"  r="210" fill="url(#aur3)"/>
    <circle class="aur4" cx="150" cy="240" r="190" fill="url(#aur4)"/>
  </g>

  <!-- ── Grid overlay ── -->
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!-- ── Scanner beam ── -->
  <rect class="scan-beam" x="0" y="0" width="1200" height="80" fill="url(#scanGrad)"/>

  <!-- ── Circuit traces ── -->
  <g class="trace" stroke="#00b4d8" stroke-width="0.8" fill="none">
    <path d="M 60,18 L 120,18 L 140,38 L 220,38"/>
    <circle cx="220" cy="38" r="2" fill="#00b4d8"/>
    <path d="M 1140,18 L 1080,18 L 1060,38 L 980,38"/>
    <circle cx="980" cy="38" r="2" fill="#00b4d8"/>
    <path d="M 60,322 L 130,322 L 155,297 L 240,297"/>
    <circle cx="240" cy="297" r="2" fill="#00b4d8"/>
    <path d="M 1140,322 L 1070,322 L 1045,297 L 960,297"/>
    <circle cx="960" cy="297" r="2" fill="#00b4d8"/>
    <path d="M 500,28 L 530,12 L 670,12 L 700,28"/>
    <circle cx="530" cy="12" r="1.5" fill="#38bdf8"/>
    <circle cx="670" cy="12" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- ── Constellation stars ── -->
  <g fill="white">
    <circle class="twa" cx="48"   cy="68"  r="1.2"/>
    <circle class="twb" cx="95"   cy="130" r="1.8"/>
    <circle class="twc" cx="138"  cy="42"  r="0.9"/>
    <circle class="twd" cx="180"  cy="95"  r="1.4"/>
    <circle class="twe" cx="225"  cy="170" r="1.0"/>
    <circle class="twf" cx="72"   cy="220" r="1.6"/>
    <circle class="twa" cx="145"  cy="260" r="1.1"/>
    <circle class="twc" cx="260"  cy="75"  r="1.5"/>
    <circle class="twb" cx="340"  cy="48"  r="1.0"/>
    <circle class="twd" cx="420"  cy="85"  r="1.7"/>
    <circle class="twe" cx="490"  cy="40"  r="1.2"/>
    <circle class="twf" cx="560"  cy="70"  r="0.9"/>
    <circle class="twa" cx="640"  cy="45"  r="1.4"/>
    <circle class="twb" cx="715"  cy="80"  r="1.1"/>
    <circle class="twc" cx="780"  cy="38"  r="1.8"/>
    <circle class="twd" cx="845"  cy="72"  r="1.0"/>
    <circle class="twe" cx="910"  cy="52"  r="1.5"/>
    <circle class="twf" cx="975"  cy="90"  r="1.2"/>
    <circle class="twa" cx="1040" cy="42"  r="1.6"/>
    <circle class="twb" cx="1110" cy="78"  r="1.0"/>
    <circle class="twc" cx="1155" cy="135" r="1.7"/>
    <circle class="twd" cx="1080" cy="190" r="1.2"/>
    <circle class="twe" cx="1135" cy="230" r="1.4"/>
    <circle class="twf" cx="1025" cy="270" r="0.9"/>
    <circle class="twa" cx="950"  cy="240" r="1.5"/>
    <circle class="twb" cx="880"  cy="285" r="1.1"/>
    <circle class="twc" cx="380"  cy="270" r="1.3"/>
    <circle class="twd" cx="290"  cy="250" r="1.0"/>
  </g>

  <!-- ── 3 Shooting stars ── -->
  <g stroke-linecap="round">
    <line class="sh1" x1="0" y1="0" x2="-80" y2="-28" stroke="#38bdf8" stroke-width="1.8"/>
    <line class="sh2" x1="0" y1="0" x2="-65" y2="-22" stroke="#a78bfa" stroke-width="1.4"/>
    <line class="sh3" x1="0" y1="0" x2="-70" y2="-20" stroke="#38bdf8" stroke-width="1.2"/>
  </g>

  <!-- ── Radar pulse nodes (left & right) ── -->
  <circle class="r1a" cx="108" cy="48" r="12" fill="none" stroke="#00b4d8" stroke-width="1.2"/>
  <circle class="r1b" cx="108" cy="48" r="26" fill="none" stroke="#00b4d8" stroke-width="0.9"/>
  <circle class="r1c" cx="108" cy="48" r="40" fill="none" stroke="#38bdf8" stroke-width="0.6"/>
  <circle cx="108" cy="48" r="3" fill="#00b4d8" opacity="0.8"/>

  <circle class="r2a" cx="1092" cy="292" r="12" fill="none" stroke="#7c4dff" stroke-width="1.2"/>
  <circle class="r2b" cx="1092" cy="292" r="26" fill="none" stroke="#7c4dff" stroke-width="0.9"/>
  <circle class="r2c" cx="1092" cy="292" r="40" fill="none" stroke="#c084fc" stroke-width="0.6"/>
  <circle cx="1092" cy="292" r="3" fill="#7c4dff" opacity="0.75"/>

  <!-- ── Corner brackets (cyberpunk accents) ── -->
  <path class="bracket br1" pathLength="60" d="M20,52 L20,18 L54,18"
        stroke="#00b4d8" stroke-width="2.5" fill="none" opacity="0.90" filter="url(#glow)"/>
  <path class="bracket br2" pathLength="60" d="M1146,18 L1180,18 L1180,52"
        stroke="#00b4d8" stroke-width="2.5" fill="none" opacity="0.90" filter="url(#glow)"/>
  <path class="bracket br3" pathLength="60" d="M20,288 L20,322 L54,322"
        stroke="#00b4d8" stroke-width="2.5" fill="none" opacity="0.90" filter="url(#glow)"/>
  <path class="bracket br4" pathLength="60" d="M1146,322 L1180,322 L1180,288"
        stroke="#00b4d8" stroke-width="2.5" fill="none" opacity="0.90" filter="url(#glow)"/>

  <!-- ── Outer border glow frame ── -->
  <rect class="border-frame" x="1" y="1" width="1198" height="338"
        fill="none" stroke="#00b4d8" stroke-width="1.2"/>

  <!-- ── Status badge (top-right) ── -->
  <g class="badge-elem">
    <rect x="1010" y="8" width="168" height="26" rx="13"
          fill="#020f28" stroke="#00b4d8" stroke-width="0.9" opacity="0.92"/>
    <circle class="status-dot" cx="1026" cy="21" r="4.5" fill="#00e676"/>
    <text x="1037" y="25.5"
          font-family="'JetBrains Mono','Courier New',monospace"
          font-size="9.5" font-weight="700" fill="#bae6fd" letter-spacing="1.2">ONLINE · OPEN TO WORK</text>
  </g>

  <!-- ── Experience badge (top-left) ── -->
  <g class="badge-elem">
    <rect x="22" y="8" width="138" height="26" rx="13"
          fill="#020f28" stroke="#7c4dff" stroke-width="0.9" opacity="0.92"/>
    <text x="91" y="25.5" text-anchor="middle"
          font-family="'JetBrains Mono','Courier New',monospace"
          font-size="9.5" font-weight="700" fill="#e9d5ff" letter-spacing="1.2">9+ YRS · SENIOR SWE</text>
  </g>

  <!-- ── Name text ── -->
  <text class="name-text" x="600" y="152"
        text-anchor="middle"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="76" font-weight="900" letter-spacing="5.5"
        fill="url(#nameGrad)">MUKTIKANTA PATI</text>

  <!-- ── Shimmer sweep (masked to name text) ── -->
  <rect class="shimmer-bar" x="-230" y="82" width="220" height="82"
        fill="url(#shimmerG)" mask="url(#nameMask)"/>

  <!-- ── Accent glow line ── -->
  <rect class="line-accent" x="180" y="168" width="840" height="2.5"
        fill="url(#lineGrad)" rx="1.5"/>

  <!-- ── Subtitle ── -->
  <text class="subtitle-text" x="600" y="205"
        text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="17" font-weight="400" letter-spacing="1.8"
        fill="#bae6fd">Senior Software Engineer  ·  Frontend Architecture  ·  React &amp; Node.js  ·  9+ Years in Production</text>

  <!-- ── Company / Skills ticker (scrolling) ── -->
  <g mask="url(#tickerMask)">
    <text class="company-ticker-text" x="0" y="233"
          text-anchor="start"
          font-family="'JetBrains Mono','Courier New',monospace"
          font-size="10.5" font-weight="400" letter-spacing="2"
          fill="#38bdf8">React.js · TypeScript · Next.js · Node.js · Microfrontends · Design Systems · Reusable Component Architecture · Express · MongoDB · AI-Assisted Dev</text>
  </g>

  <!-- ── Tech stack monospace bar ── -->
  <text class="tech-text" x="600" y="258"
        text-anchor="middle"
        font-family="'JetBrains Mono','Courier New',monospace"
        font-size="12.5" font-weight="400" letter-spacing="4.5"
        fill="#58A6FF">React.js  ·  TypeScript  ·  Next.js  ·  Node.js  ·  Microfrontends  ·  MongoDB  ·  Docker  ·  AI Workflows</text>

  <!-- ── Bottom wave (seamless blend with GitHub Dark mode #0d1117) ── -->
  <path d="M0,295 Q120,278 240,292 Q360,306 480,292 Q600,278 720,292 Q840,306 960,292 Q1080,278 1200,292 L1200,340 L0,340 Z"
        fill="#0d1117" opacity="0.95"/>
  <path d="M0,308 Q150,294 300,308 Q450,322 600,308 Q750,294 900,308 Q1050,322 1200,308 L1200,340 L0,340 Z"
        fill="#0d1117"/>
</svg>
